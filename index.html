@font-face { font-family: "Lovelo"; src: url("fonts/Lovelo.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Balgin"; src: url("fonts/Balgin.woff2") format("woff2"); font-display: swap; }

:root {
  --fond: #f7f7f3;
  --bleu: #a7b9c8;
  --bleu-texte: #5f7a91;
  --encre: #464742;
  --blanc: #ffffff;
  --titre: "Lovelo", "Montserrat", sans-serif;
  --texte: "Balgin", "Josefin Sans", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--fond);
  color: var(--encre);
  font-family: var(--texte);
  font-size: 1.12rem;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
main { max-width: 46rem; margin: 0 auto; padding: 4.5rem 1.5rem 3rem; }

/* ---------- En-tête ---------- */
header { text-align: center; margin-bottom: 3rem; }
h1 {
  font-family: var(--titre);
  font-weight: 800;
  font-size: clamp(2.1rem, 7vw, 3.8rem);
  line-height: 1.05;
  color: var(--bleu);
  margin: 0 0 1.1rem;
}
.metiers {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.2rem 0.7rem;
  margin: 0 0 1.6rem;
  font-size: 1.1rem;
  font-weight: 300;
  letter-spacing: 0.03em;
}
.metiers span:not(:last-child)::after { content: "·"; margin-left: 0.7rem; color: var(--bleu); font-weight: 600; }

/* Onde sonore décorative */
.vague { display: flex; justify-content: center; align-items: center; gap: 5px; height: 36px; }
.vague i {
  display: block;
  width: 3px;
  border-radius: 3px;
  background: var(--bleu);
  animation: respire 2.4s ease-in-out infinite alternate;
}
@keyframes respire { from { transform: scaleY(0.5); } to { transform: scaleY(1); } }

/* ---------- Cartes ---------- */
.carte {
  position: relative;
  background: var(--blanc);
  border: 1px solid var(--bleu);
  border-radius: 8px;
  padding: 2.5rem 2.5rem 2.25rem;
  margin-bottom: 1.5rem;
  text-align: center;
  box-shadow: 0 0 0 0 rgba(167, 185, 200, 0);
  transition: box-shadow 0.5s ease, transform 0.5s ease;
}
.carte.en { background: #eef2f5; }
.carte::after {
  content: "";
  position: absolute;
  left: 8px; right: 8px; bottom: -1px;
  height: 3px;
  background: var(--bleu-texte);
  border-radius: 3px;
  transform: scaleX(0);
  transition: transform 0.6s ease;
}
.carte:hover, .carte:focus-within {
  box-shadow: 0 0 0 5px rgba(167, 185, 200, 0.3);
  transform: translateY(-2px);
}
.carte:hover::after, .carte:focus-within::after { transform: scaleX(1); }

.etiquette {
  margin: 0 0 0.4rem;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--bleu-texte);
}
.carte h2 {
  font-family: var(--titre);
  font-weight: 800;
  font-size: 1.15rem;
  line-height: 1.35;
  margin: 0 0 1.5rem;
}
.carte p.texte {
  margin: 0 0 1rem;
  font-weight: 300;
  text-align: justify;
  text-justify: inter-word;
  hyphens: auto;
}
.carte p.texte:last-of-type { margin-bottom: 1.8rem; }

/* ---------- Bouton ---------- */
.bouton {
  display: inline-block;
  padding: 0.85rem 1.8rem;
  color: var(--fond);
  font-family: var(--texte);
  font-size: 1rem;
  font-weight: 600;
  text-decoration: none;
  border-radius: 999px;
  background:
    linear-gradient(var(--bleu-texte), var(--bleu-texte)) no-repeat left center / 0% 100%,
    var(--encre);
  transition: background-size 0.5s ease, transform 0.3s ease, box-shadow 0.3s ease;
}
